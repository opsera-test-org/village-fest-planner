name: 2-Village Dev Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/1-bootstrap-*.yaml'
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

env:
  TENANT: opsera
  APP_NAME: village
  ENVIRONMENT: dev
  AWS_REGION: us-west-2
  HUB_CLUSTER: argocd-usw2
  SPOKE_CLUSTER: opsera-usw2-np
  NAMESPACE: opsera-village-dev
  ECR_REPO_NAME: opsera/village
  ARGOCD_SERVER: argocd-usw2.agent.opsera.dev

permissions:
  contents: write
  id-token: write
  security-events: write

jobs:
  # Stage 1: Secret Scanning (Warn-Only)
  gitleaks-scan:
    name: "Stage 1: Gitleaks Secret Scan"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Stage 2: Build Image (Local Only, No Push)
  build-image:
    name: "Stage 2: Build Docker Image"
    runs-on: ubuntu-latest
    needs: [gitleaks-scan]
    if: always()
    outputs:
      image_tag: ${{ steps.generate-tag.outputs.tag }}
      short_sha: ${{ steps.generate-tag.outputs.short_sha }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Image Tag
        id: generate-tag
        run: |
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          IMAGE_TAG="${SHORT_SHA}-${TIMESTAMP}"
          echo "tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "Generated image tag: ${IMAGE_TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Local Only)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: village:${{ steps.generate-tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/village-image.tar

      - name: Upload Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: village-image
          path: /tmp/village-image.tar
          retention-days: 1

  # Stage 3: Grype Vulnerability Scan
  grype-scan:
    name: "Stage 3: Grype Vulnerability Scan"
    runs-on: ubuntu-latest
    needs: [build-image]
    continue-on-error: true
    steps:
      - name: Download Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: village-image
          path: /tmp

      - name: Load Docker Image
        run: |
          docker load --input /tmp/village-image.tar
          docker images

      - name: Run Grype Scan
        uses: anchore/scan-action@v3
        id: grype-scan
        with:
          image: "village:${{ needs.build-image.outputs.image_tag }}"
          fail-build: false
          severity-cutoff: high
          output-format: sarif

      - name: Upload Grype Results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: ${{ steps.grype-scan.outputs.sarif }}

      - name: Generate Grype Report
        uses: anchore/scan-action@v3
        with:
          image: "village:${{ needs.build-image.outputs.image_tag }}"
          fail-build: false
          output-format: table

  # Stage 4: Push to ECR
  push-to-ecr:
    name: "Stage 4: Push Image to ECR"
    runs-on: ubuntu-latest
    needs: [build-image, grype-scan]
    if: always() && needs.build-image.result == 'success'
    outputs:
      ecr_image: ${{ steps.push.outputs.ecr_image }}
    steps:
      - name: Download Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: village-image
          path: /tmp

      - name: Load Docker Image
        run: |
          docker load --input /tmp/village-image.tar

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push to ECR
        id: push
        env:
          IMAGE_TAG: ${{ needs.build-image.outputs.image_tag }}
        run: |
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          ECR_IMAGE="${ECR_REGISTRY}/${ECR_REPO_NAME}:${IMAGE_TAG}"

          docker tag village:${IMAGE_TAG} ${ECR_IMAGE}
          docker push ${ECR_IMAGE}

          echo "ecr_image=${ECR_IMAGE}" >> $GITHUB_OUTPUT
          echo "✓ Image pushed to ECR: ${ECR_IMAGE}"

  # Stage 5: Refresh ECR Secret (SPOKE Cluster)
  refresh-ecr-secret:
    name: "Stage 5: Refresh ECR Secret"
    runs-on: ubuntu-latest
    needs: [push-to-ecr]
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Kubeconfig (SPOKE)
        run: |
          aws eks update-kubeconfig --name ${SPOKE_CLUSTER} --region ${AWS_REGION} --alias spoke

      - name: Refresh ECR Pull Secret (Idempotent)
        run: |
          set -e

          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          ECR_TOKEN=$(aws ecr get-login-password --region ${AWS_REGION})

          kubectl --context spoke delete secret ecr-secret -n ${NAMESPACE} --ignore-not-found=true

          kubectl --context spoke create secret docker-registry ecr-secret \
            --docker-server=${ECR_REGISTRY} \
            --docker-username=AWS \
            --docker-password=${ECR_TOKEN} \
            -n ${NAMESPACE}

          echo "✓ ECR secret refreshed in namespace: ${NAMESPACE}"

  # Stage 6: Update Manifests (Kustomize)
  update-manifests:
    name: "Stage 6: Update Manifests"
    runs-on: ubuntu-latest
    needs: [refresh-ecr-secret, push-to-ecr]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update Kustomize Image Tag (Idempotent)
        env:
          ECR_IMAGE: ${{ needs.push-to-ecr.outputs.ecr_image }}
        run: |
          set -e

          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          ECR_REPO="${ECR_REGISTRY}/${ECR_REPO_NAME}"
          IMAGE_TAG="${{ needs.build-image.outputs.image_tag }}"

          cd .opsera-${APP_NAME}/k8s/overlays/${ENVIRONMENT}

          # Update kustomization.yaml - keep name: PLACEHOLDER_ECR_URI, only update newName and newTag
          sed -i "s|newName: PLACEHOLDER_ECR_URI|newName: ${ECR_REPO}|g" kustomization.yaml
          sed -i "s|newTag:.*|newTag: ${IMAGE_TAG}|g" kustomization.yaml

          # Keep deployment.yaml unchanged - kustomize will replace PLACEHOLDER_ECR_URI at build time
          # DO NOT modify deployment.yaml image field

          echo "✓ Manifests updated with image: ${ECR_REPO}:${IMAGE_TAG}"
          cat kustomization.yaml

      - name: Commit and Push Changes (Idempotent)
        run: |
          set -e

          # Pull latest changes first
          git pull --rebase origin main || true

          # Check if there are changes
          if git diff --quiet; then
            echo "✓ No manifest changes to commit"
            exit 0
          fi

          # Commit and push
          git add .opsera-${APP_NAME}/k8s/overlays/${ENVIRONMENT}/
          git commit -m "Update ${ENVIRONMENT} manifests for ${APP_NAME} [skip ci]

          Image: ${{ needs.push-to-ecr.outputs.ecr_image }}
          Commit: ${{ github.sha }}

          Co-Authored-By: Claude Sonnet 4.5 <noreply@anthropic.com>"

          # Retry push with rebase on conflict
          MAX_RETRIES=3
          for i in $(seq 1 $MAX_RETRIES); do
            if git push origin main; then
              echo "✓ Manifests pushed successfully"
              break
            else
              echo "Push failed, retrying with rebase... ($i/$MAX_RETRIES)"
              git pull --rebase origin main
              if [ $i -eq $MAX_RETRIES ]; then
                echo "❌ Failed to push after $MAX_RETRIES attempts"
                exit 1
              fi
            fi
          done

  # Stage 7: Create/Update ArgoCD Application (Idempotent)
  create-argocd-app:
    name: "Stage 7: Create ArgoCD App"
    runs-on: ubuntu-latest
    needs: [update-manifests]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Kubeconfig (HUB)
        run: |
          aws eks update-kubeconfig --name ${HUB_CLUSTER} --region ${AWS_REGION} --alias hub

      - name: Create/Update ArgoCD Application (Idempotent)
        run: |
          set -e

          kubectl --context hub apply -f .opsera-${APP_NAME}/argocd/${ENVIRONMENT}/application.yaml

          echo "✓ ArgoCD application created/updated: ${APP_NAME}-${ENVIRONMENT}"

  # Stage 8: ArgoCD Hard Refresh
  argocd-refresh:
    name: "Stage 8: ArgoCD Hard Refresh"
    runs-on: ubuntu-latest
    needs: [create-argocd-app]
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Kubeconfig (HUB)
        run: |
          aws eks update-kubeconfig --name ${HUB_CLUSTER} --region ${AWS_REGION} --alias hub

      - name: Hard Refresh ArgoCD Application
        run: |
          set -e

          kubectl --context hub patch application ${APP_NAME}-${ENVIRONMENT} -n argocd \
            --type merge -p '{"metadata":{"annotations":{"argocd.argoproj.io/refresh":"hard"}}}'

          echo "✓ ArgoCD application refreshed: ${APP_NAME}-${ENVIRONMENT}"

  # Stage 9: Sync ArgoCD Application
  argocd-sync:
    name: "Stage 9: Sync ArgoCD Application"
    runs-on: ubuntu-latest
    needs: [argocd-refresh]
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Kubeconfig (HUB)
        run: |
          aws eks update-kubeconfig --name ${HUB_CLUSTER} --region ${AWS_REGION} --alias hub

      - name: Trigger Sync
        run: |
          set -e

          kubectl --context hub patch application ${APP_NAME}-${ENVIRONMENT} -n argocd \
            --type merge -p '{"operation":{"initiatedBy":{"username":"github-actions"},"sync":{"syncStrategy":{"hook":{}}}}}'

          echo "✓ ArgoCD sync triggered"

      - name: Wait for Sync Completion
        run: |
          set -e

          echo "Waiting for ArgoCD sync to complete..."
          for i in {1..60}; do
            SYNC_STATUS=$(kubectl --context hub get application ${APP_NAME}-${ENVIRONMENT} -n argocd -o jsonpath='{.status.sync.status}')
            HEALTH_STATUS=$(kubectl --context hub get application ${APP_NAME}-${ENVIRONMENT} -n argocd -o jsonpath='{.status.health.status}')

            echo "Sync: ${SYNC_STATUS}, Health: ${HEALTH_STATUS}"

            if [ "$SYNC_STATUS" = "Synced" ] && [ "$HEALTH_STATUS" = "Healthy" ]; then
              echo "✓ ArgoCD application is Synced and Healthy"
              exit 0
            fi

            if [ "$HEALTH_STATUS" = "Degraded" ]; then
              echo "❌ ArgoCD application is Degraded"
              kubectl --context hub get application ${APP_NAME}-${ENVIRONMENT} -n argocd -o yaml
              exit 1
            fi

            sleep 10
          done

          echo "❌ Timeout waiting for ArgoCD sync"
          exit 1

  # Stage 10: Verify Deployment
  verify-deployment:
    name: "Stage 10: Verify Deployment"
    runs-on: ubuntu-latest
    needs: [argocd-sync]
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Kubeconfig (SPOKE)
        run: |
          aws eks update-kubeconfig --name ${SPOKE_CLUSTER} --region ${AWS_REGION} --alias spoke

      - name: Verify Pods
        run: |
          set -e

          echo "Checking pod status..."
          kubectl --context spoke get pods -n ${NAMESPACE} -l app=${APP_NAME}

          # Wait for pods to be ready
          kubectl --context spoke wait --for=condition=ready pod \
            -l app=${APP_NAME} -n ${NAMESPACE} --timeout=300s

          echo "✓ All pods are ready"

      - name: Verify Deployment Rollout
        run: |
          set -e

          kubectl --context spoke rollout status deployment/${APP_NAME} -n ${NAMESPACE} --timeout=300s

          echo "✓ Deployment rollout completed successfully"

      - name: Health Check
        run: |
          set -e

          REPLICAS=$(kubectl --context spoke get deployment ${APP_NAME} -n ${NAMESPACE} -o jsonpath='{.status.readyReplicas}')
          DESIRED=$(kubectl --context spoke get deployment ${APP_NAME} -n ${NAMESPACE} -o jsonpath='{.spec.replicas}')

          echo "Ready Replicas: ${REPLICAS}/${DESIRED}"

          if [ "$REPLICAS" = "$DESIRED" ]; then
            echo "✓ All replicas are ready"
          else
            echo "❌ Not all replicas are ready"
            exit 1
          fi

  # Stage 11: Deployment Landscape
  deployment-landscape:
    name: "Stage 11: Deployment Landscape"
    runs-on: ubuntu-latest
    needs: [verify-deployment]
    if: always()
    steps:
      - name: Generate Deployment Summary
        run: |
          cat <<EOF >> $GITHUB_STEP_SUMMARY
          ## 🚀 Deployment Summary

          **Application:** ${APP_NAME}
          **Environment:** ${ENVIRONMENT}
          **Namespace:** ${NAMESPACE}
          **Cluster:** ${SPOKE_CLUSTER}
          **Image:** ${{ needs.push-to-ecr.outputs.ecr_image }}
          **Commit:** \`${{ github.sha }}\`
          **URL:** https://village-dev.agent.opsera.dev

          ### Pipeline Stages
          - ✅ Stage 1: Gitleaks Scan
          - ✅ Stage 2: Build Image
          - ✅ Stage 3: Grype Scan
          - ✅ Stage 4: Push to ECR
          - ✅ Stage 5: Refresh ECR Secret
          - ✅ Stage 6: Update Manifests
          - ✅ Stage 7: Create ArgoCD App
          - ✅ Stage 8: ArgoCD Refresh
          - ✅ Stage 9: ArgoCD Sync
          - ✅ Stage 10: Verify Deployment
          - ✅ Stage 11: Deployment Landscape

          ### ArgoCD Dashboard
          🔗 [View in ArgoCD](https://${ARGOCD_SERVER}/applications/${APP_NAME}-${ENVIRONMENT})
          EOF

          echo "✓ Deployment landscape generated"
